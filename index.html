<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenvixo</title>
<style>
  :root { --bg:#f6fafa; --card:#ffffff; --ink:#1e282d; --muted:#5b6b70; --accent:#0e6e6e; --line:#d9e4e4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1516; --card:#172022; --ink:#e3eeee; --muted:#9db0b2; --accent:#5cc4c4; --line:#2a3a3c; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font:16px/1.7 "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; max-width:460px; width:100%; text-align:center; }
  h1 { color:var(--accent); margin:0 0 4px; font-size:30px; }
  p { margin:4px 0 18px; color:var(--muted); }
  a.btn { display:block; margin:10px 0; padding:12px; border-radius:10px; border:1px solid var(--accent); color:var(--accent); text-decoration:none; font-weight:600; }
  footer { margin-top:16px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Lenvixo</h1>
    <p>قياس PD وارتفاعات التركيب للعدسات المالتي فوكل<br>PD &amp; fitting-height measurement for progressive lenses</p>
    <a class="btn" href="privacy.html">سياسة الخصوصية · Privacy Policy</a>
    <a class="btn" href="terms.html">شروط الاستخدام · Terms of Use</a>
    <footer>© 2026 Farrag Tech</footer>
  </div>
</body>
</html>
